<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Social links profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>

  <main>
    <article class="wrapper">
      <div class="profile_info">
        <img class="profile_img" src="./assets/images/avatar-jessica.jpeg" alt="Profile Picture" width="176" height="176">
        <h1 class="name">Jessica Randall</h1>
        <p class="location"><span>London, United Kingdom</span></>
        <p class="job_description">"Front-end developer and avid reader."</p>
      </div>
      <ul class="media_links">
        <li><a href="https://github.com/vrroel">GitHub</a></li>
        <li><a href="https://www.frontendmentor.io/profile/vrroel">Frontend Mentor</a></li>
        <li><a href="https://www.linkedin.com/in/alexis-villarroel/">LinkedIn</a></li>
        <li><a href="https://t.me/verroele">Telegram</a></li>
      </ul>
    </article>
  </main>

  <footer class="attribution">
    <p>Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.</p>
    <p>Coded by<a href="https://vrroel.github.io/frontend_mentor_hub/"> Alexis V</a>.</p>
  </footer>
</body>

</html>
